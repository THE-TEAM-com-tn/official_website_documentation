<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Team">
  <!--
    Favicon for theteam.com.tn — the THE/TEAM wordmark, stacked so it stays
    legible in a square, and two-tone like the real logo: "THE" in the dark
    ink, "TEAM" in the brand green (#259D79).

    The tile is painted explicitly rather than left transparent: a transparent
    favicon shows the browser chrome through it, which made the icon look grey
    on Chrome's tab strip.

    ONE tile only — white, near-black "THE", brand green "TEAM" — in every
    theme. A dark-mode variant (navy tile) used to be switched in here via
    prefers-color-scheme; it was removed on purpose so the icon matches the PNG
    set (all white) and never shows a dark tile. Don't add it back.

    Sizing: both lines share one font-size, as they do in the real wordmark
    (uniform cap height). The widest line, "TEAM", measures ~44 of the 64
    viewBox units — about 69% — leaving ~10 units of margin each side.

    No webfont: external resources don't load in a favicon, so this uses a
    system stack approximating the logo's condensed grotesque.
  -->
  <style>
    .tile { fill: #ffffff; }
    .wordmark {
      font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .the  { fill: #0b0b12; }
    .team { fill: #259d79; }
  </style>

  <rect class="tile" x="0" y="0" width="64" height="64" rx="13" ry="13" />

  <text class="wordmark the"  x="32" y="29"   font-size="16" text-anchor="middle">THE</text>
  <text class="wordmark team" x="32" y="46.5" font-size="16" text-anchor="middle">TEAM</text>
</svg>
