<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TheTeam Docs">
  <!--
    Favicon for the documentation site only — deliberately NOT the website's
    icon (white tile + THE/TEAM wordmark), so a docs tab is never mistaken for
    theteam.com.tn.

    A brand-green page with a folded top-right corner (= documentation) and a
    white "T" (= TheTeam). The green tile is opaque, so the icon reads the same
    on light and dark tab strips; no white background, no dark-mode variant.

    The "T" is drawn with rectangles, not text (no webfonts in a favicon), on
    a 4-unit grid so its strokes land on whole pixels at 16px and 32px.
  -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28A982" />
      <stop offset="1" stop-color="#1E7F62" />
    </linearGradient>
  </defs>

  <!-- the page, top-right corner cut off for the fold -->
  <path fill="url(#page)"
        d="M12 0H46L64 18V52A12 12 0 0 1 52 64H12A12 12 0 0 1 0 52V12A12 12 0 0 1 12 0Z" />

  <!-- the folded corner -->
  <path fill="#3CC49A" d="M46 0V12A6 6 0 0 0 52 18H64Z" />

  <!-- the T -->
  <rect fill="#ffffff" x="16" y="22" width="32" height="8" rx="1.5" />
  <rect fill="#ffffff" x="28" y="22" width="8" height="28" rx="1.5" />
</svg>
